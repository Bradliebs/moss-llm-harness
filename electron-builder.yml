appId: com.moss.app
productName: Moss
copyright: Copyright © 2025

directories:
  output: release
  buildResources: build

# Whitelist the app's own compiled output and the raw preload bridge. The main
# process loads electron/preload.cjs and dist/index.html from app.getAppPath(),
# so both paths must be preserved verbatim. electron-builder additionally
# bundles production dependencies (e.g. @modelcontextprotocol/sdk) automatically.
files:
  - dist-electron/**/*
  - dist/**/*
  - electron/preload.cjs
  - package.json

asar: true
# The Copilot SDK starts its runtime executable as a child process, which
# cannot run from inside the archive.
asarUnpack:
  - "**/node_modules/@github/copilot-sdk-*/**"
  - "node_modules/koffi/**"
extraResources:
  - from: electron/backend/moss/capabilities/catalog-artifacts
    to: catalog-artifacts
    filter:
      - "**/*"
# No native modules are compiled (the Copilot runtime ships prebuilt), so skip the rebuild step.
npmRebuild: false

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
