name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:deterministic
      - run: npm run test:coverage
      - name: Scripted-provider behavior and sandbox routing
        run: npm test -- --run electron/backend/moss/evals/representative-corpus.e2e.test.ts electron/backend/moss/evals/sandbox-tools.test.ts
      - run: npm run build
      - name: Enforce renderer bundle budget
        run: npm run check:bundle
      - name: Build unsigned packaged application
        run: npm run pack:ci
      - name: Run packaged critical-path smoke
        run: npm run smoke:packaged
      - name: Validate representative corpus and graders
        shell: pwsh
        run: |
          $env:MOSS_EVAL_CORPUS = "representative"
          $env:MOSS_EVAL_EXPERIMENT = "phase5-runtime"
          npm run eval:health
